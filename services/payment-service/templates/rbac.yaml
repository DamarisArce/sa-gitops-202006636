apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "payment-service.fullname" . }}-role
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "payment-service.fullname" . }}-rolebinding
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "payment-service.fullname" . }}-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "payment-service.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io