apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ toYaml .Values | sha256sum | trunc 12 }}
data:
  AUTH_SERVICE_URL: "http://{{ .Release.Name }}-auth-service:8001"
  MEDICINE_SERVICE_URL: "http://{{ .Release.Name }}-medicine-service:8002"
  ORDER_SERVICE_URL: "http://{{ .Release.Name }}-order-service:8003"
  PAYMENT_SERVICE_URL: "http://{{ .Release.Name }}-payment-service:8004"
  SERVICE_PORT: {{ .Values.service.port | quote }}
  {{- $environment := .Values.global.environment | default "dev" }}
  {{- if eq $environment "prod" }}
  LOG_LEVEL: "warning"
  {{- else if eq $environment "dev" }}
  LOG_LEVEL: "debug"
  {{- else }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  {{- end }}
  {{- range .Values.env.extra }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}