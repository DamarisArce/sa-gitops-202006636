apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-service.fullname" . }}-config
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
  annotations:
    # Se recalcula automáticamente si cambia este archivo → dispara reinicio de pods
    checksum/config: {{ toYaml .Values | sha256sum | trunc 12 }}
data:
  DB_HOST: {{ .Values.database.host | default "postgres" | quote }}
  DB_PORT: {{ .Values.database.port | default "5432" | quote }}
  DB_USER: {{ .Values.database.user | default "sa" | quote }}
  DB_NAME: {{ .Values.database.name | default "pharmadb" | quote }}
  AUTH_SERVICE_URL: "http://{{ .Release.Name }}-auth-service:8001"
  RABBITMQ_HOST: "{{ .Release.Name }}-rabbitmq"
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | default "/" | quote }}
  {{- if eq .Values.global.environment "prod" }}
  LOG_LEVEL: "warning"
  {{- else if eq .Values.global.environment "dev" }}
  LOG_LEVEL: "debug"
  {{- else }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  {{- end }}
  SERVICE_PORT: {{ .Values.service.port | quote }}
  {{- range .Values.env.extra }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}