apiVersion: v1
kind: ConfigMap
metadata:
  name: sa-p9-config
  namespace: sa-p9
data:
  # --- Base de datos central ---
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: sa
  DB_NAME: pharmadb

  # --- URLs de servicio (Release único "sa-p9") ---
  AUTH_SERVICE_URL: "http://sa-p9-auth-service:8001"
  MEDICINE_SERVICE_URL: "http://sa-p9-medicine-service:8002"
  ORDER_SERVICE_URL: "http://sa-p9-order-service:8003"
  PAYMENT_SERVICE_URL: "http://sa-p9-payment-service:8004"

  # --- RabbitMQ ---
  RABBITMQ_HOST: sa-p9-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"